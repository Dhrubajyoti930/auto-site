<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rider | Trip Details</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
        :root {
            --bg: #0b1329;
            --card: #1c2541;
            --border: #3a506b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #058240;
            --green-light: #4ade80;
            --yellow: #ffcc00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: #fff; text-decoration: none; margin-bottom: 32px; }
        .logo span { color: var(--yellow); }

        .trip-card {
            background: var(--card);
            border: 1.5px solid var(--green-light);
            border-radius: 14px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        .win-icon { font-size: 3rem; margin-bottom: 12px; }
        .win-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--green-light);
            margin-bottom: 6px;
        }
        .win-sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

        .fare-display {
            background: rgba(74,222,128,0.08);
            border: 1.5px solid rgba(74,222,128,0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .fare-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .fare-amount {
            font-family: 'Syne', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: var(--green-light);
            line-height: 1;
        }

        .route-block {
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
            text-align: left;
        }
        .route-item { margin-bottom: 14px; }
        .route-item:last-child { margin-bottom: 0; }
        .route-item-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
        .route-item-value { font-size: 16px; font-weight: 600; }
        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 12px 0; }

        .map-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--yellow);
            color: #0b1329;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            font-family: 'DM Sans', sans-serif;
            transition: background 0.2s;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .map-btn:hover { background: #d97706; color: #fff; }

        .dashboard-link {
            display: block;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
            margin-top: 6px;
            transition: color 0.2s;
        }
        .dashboard-link:hover { color: var(--text); }

        .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .trip-card { position: relative; z-index: 1; }
    </style>
</head>
<body>

<a href="index.html" class="logo">Auto <span>Rider</span></a>

<div class="trip-card">
    <div class="win-icon">🏆</div>
    <div class="win-title">You Won!</div>
    <div class="win-sub">You secured this ride. Head to the pickup point now.</div>

    <div class="fare-display">
        <div class="fare-label">Your Winning Fare</div>
        <div class="fare-amount" id="fare-display">₹—</div>
    </div>

    <div class="route-block">
        <div class="route-item">
            <div class="route-item-label">📍 Pickup</div>
            <div class="route-item-value" id="trip-pickup">—</div>
        </div>
        <hr class="divider">
        <div class="route-item">
            <div class="route-item-label">🏁 Destination</div>
            <div class="route-item-value" id="trip-dest">—</div>
        </div>
    </div>

    <a id="map-link" href="map.html" class="map-btn">🗺 Open Route on Map</a>
    <a href="driver_dashboard.html" class="dashboard-link">← Back to Dashboard</a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const pickup = params.get('pickup') || 'Not specified';
    const destination = params.get('destination') || 'Not specified';
    const fare = params.get('fare') || '—';

    document.getElementById('trip-pickup').innerText = pickup;
    document.getElementById('trip-dest').innerText = destination;
    document.getElementById('fare-display').innerText = fare !== '—' ? '₹' + fare : '—';

    // Link map to destination
    const encodedDest = encodeURIComponent(destination);
    document.getElementById('map-link').href = `map.html?dest=${encodedDest}`;
</script>
</body>
</html>
