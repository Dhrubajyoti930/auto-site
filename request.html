<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Ride</title>
    <style>
        :root { --bg-color: #0b1329; --card-bg: #1c2541; --text-main: #f8fafc; --primary: #f59e0b; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .request-card { background: var(--card-bg); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #3a506b; }
        h2 { color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #0b1329; border: 1px solid #3a506b; color: white; border-radius: 6px; box-sizing:border-box;}
        button { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; color: #0b1329; }
        button:hover { background: #d97706; }
        .back-link { margin-top:20px; font-size:14px; color: #94a3b8; text-decoration:none; }
    </style>
</head>
<body>

    <div class="request-card" id="request-ui">
        <h2>🛺 Where to?</h2>
        <div class="form-group">
            <label>Pickup Location</label>
            <input type="text" id="pickup" placeholder="Enter pickup location">
        </div>
        <div class="form-group">
            <label>Destination</label>
            <input type="text" id="destination" placeholder="Enter destination">
        </div>
        <button onclick="publishRide()">Request Ride</button>
    </div>
    
    <a href="index.html" class="back-link">← Back to Home</a>

<script>
    const localBus = new BroadcastChannel('auto_ride_bidding_bus');
    function publishRide() {
        const pickup = document.getElementById('pickup').value;
        const destination = document.getElementById('destination').value;
        if(!pickup || !destination) {
            alert("Please enter both locations.");
            return;
        }

        localBus.postMessage({
            type: 'NEW_RIDE_REQUEST',
            pickup: pickup,
            destination: destination
        });
        document.getElementById('request-ui').innerHTML = `
            <h2>📡 Searching for Drivers</h2>
            <p>Your request from <strong>${pickup}</strong> to <strong>${destination}</strong> has been broadcast.</p>
            <p style="margin-top:15px; font-size:0.9rem; color:#94a3b8;">Waiting for driver offers...</p>
        `;
    }
</script>
</body>
</html>
